<!doctype html>
<html lang="en" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Paper Wing</title>
<meta name="description" content="Guide a paper plane between frozen clock towers under a giant black hole.">
<meta name="theme-color" content="#1b1838">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-v2-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-v2.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Paper Wing">
<style>
  @font-face { font-family: "Bungee"; src: url("fonts/bungee-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Figtree"; src: url("fonts/figtree-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Figtree"; src: url("fonts/figtree-latin-600-normal.woff2") format("woff2"); font-weight: 600; font-display: swap; }
  @font-face { font-family: "Figtree"; src: url("fonts/figtree-latin-800-normal.woff2") format("woff2"); font-weight: 800; font-display: swap; }
  /* Tek dünya: alacakaranlıkta donmuş şehir, bu kez üç boyutlu. Tema bilinçli olarak koyu. */
  :root {
    --ink: #1b1838;
    --dusk: #5a3a6e;
    --paper: #fbf7ef;
    --glow: #ffcf6b;
    --panel: rgba(27, 24, 56, 0.86);
    --panel-edge: #4a3f7a;
    --font-display: "Bungee", "Impact", "Arial Black", sans-serif;
    --font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ink); color: var(--paper); font-family: var(--font-body);
    overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
  }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; background: var(--ink); touch-action: none; }
  #wrap { position: relative; }
  #game { display: block; touch-action: none; }
  #hud { position: absolute; inset: 0; pointer-events: none; }
  #score {
    /* v3.0.3: tekrar üstte (tam ekranda gök cisimleri aşağı indiği için artık kapatmıyor) */
    position: absolute; top: max(1.6%, env(safe-area-inset-top, 0px)); left: 0; right: 0; text-align: center;
    font-family: var(--font-display); font-size: clamp(36px, 10.5vmin, 62px); color: var(--paper);
    text-shadow: 0 3px 0 var(--ink), 0 0 18px rgba(255, 207, 107, 0.35);
    font-variant-numeric: tabular-nums;
    transform-origin: 50% 60%;
  }
  #flash { position: absolute; inset: 0; background: var(--paper); opacity: 0; }
  #ver { position: absolute; bottom: 1.2%; left: 0; right: 0; text-align: center; font: 600 11px/1 var(--font-body); letter-spacing: .12em; color: var(--paper); opacity: .45; }
  #ui { position: fixed; inset: 0; touch-action: none; }
  #fallback { position: fixed; inset: 0; display: grid; place-items: center; padding-inline: 24px; text-align: center; background: var(--ink); }
  #fallback[hidden] { display: none; }
</style>
<link rel="preload" href="fonts/anton-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<!-- v2.5: FYST açılış logosu (intro.js) — yükleme biter bitmez oynar, dokununca atlanır -->
<div id="intro" style="position:fixed;inset:0;background:#000;z-index:1000"><div id="introFlash"></div><div id="introLogo"><canvas id="introCv"></canvas><div class="introStar s1"></div><div class="introStar s2"></div><div class="introStar s3"></div></div></div>
<script src="intro.js"></script>

<div id="stage">
  <div id="wrap">
    <canvas id="game" aria-label="Paper Wing game"></canvas>
    <div id="hud"><div id="score" hidden></div><div id="flash"></div><div id="ver"></div></div>
  </div>
</div>
<div id="ui"></div>
<p id="fallback" hidden>This device can't run 3D graphics (WebGL).</p>

<script src="three.min.js"></script>
<script>
  window.KK = window.KK || {};
  // Her güncellemede bunu ve sw.js'deki VERSION'ı birlikte artır
  KK.APP_VERSION = '3.1.2';
  KK.W = 360; KK.H = 640; KK.GROUND_Y = 584;
  KK.PALETTE = { skyTop:'#1b1838', skyMid:'#5a3a6e', skyLow:'#e9825a', sun:'#ffcf6b', cityFar:'#3a2f5c', cityNear:'#26203f', tower:'#2e2852', towerEdge:'#4a3f7a', clockFace:'#f3ead8', clockInk:'#1b1838', paper:'#fbf7ef', paperShade:'#d9d0c0', ground:'#171430', groundTop:'#3d335f', glow:'#ffcf6b', text:'#fbf7ef' };
</script>
<!-- game.js ve ui.js 2D sürümden geldi; çizim modülü 3D ile değiştirildi -->
<script src="game.js"></script>
<script src="render3d.js"></script>
<script src="music.js"></script>
<script src="online.js"></script>
<script src="ui.js"></script>
<script>
(function () {
  var canvas = document.getElementById('game');
  if (!window.THREE) { document.getElementById('fallback').hidden = false; return; }

  // v2.5: daha keskin gezegenler için çözünürlük sınırı 1.75 → 2.0 (piksel yükü 2.0²/1.75² = +%31).
  // Koruma: oynarken ilk 180 karenin ortalaması 50 fps altındaysa sınır 1.5'e iner (1.5²/1.75² = −%26).
  // v3.0: kademeli otomatik kalite. Her 180 karelik ölçümde ortalama < 50 fps ise bir kademe iner:
  //   0: DPR 2.0 + gölge → 1: DPR 1.5 (piksel −%44) → 2: DPR 1.25 (−%61) → 3: DPR 1.25 + gölgeler kapalı
  // Seçilen kademe cihazda saklanır, sonraki açılışta oradan başlar (her seferinde baştan yavaşlamasın).
  var PERF_KEY = 'kk.perf', LV_DPR = [2.0, 1.5, 1.25, 1.25];
  var perfLv = 0; try { perfLv = Math.max(0, Math.min(3, parseInt(localStorage.getItem(PERF_KEY), 10) || 0)); } catch (e) { /* yoksay */ }
  var dprCap = LV_DPR[perfLv], perfN = 0, perfMs = 0, perfDone = perfLv >= 3;
  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, dprCap); // 3D'de piksel yükünü sınırla (v2.5: 2.0, yavaş cihazda 1.5)
    var scale = Math.min(window.innerWidth / KK.W, window.innerHeight / KK.H);
    var cssW = Math.floor(KK.W * scale), cssH = Math.floor(KK.H * scale);
    // v3.0: telefon ekranı 9:16'dan uzunsa (çoğu telefon ~9:20) tüm ekranı kapla — üst/alt şeritler kalkar.
    // En fazla 9:22'ye kadar uzar (daha uzun ekranlarda küçük şerit kalır). Geniş ekranda (PC) eski çerçeve.
    if (window.innerHeight / window.innerWidth > KK.H / KK.W) { cssW = window.innerWidth; cssH = Math.min(window.innerHeight, Math.floor(cssW * 22 / 9)); }
    canvas.style.width = cssW + 'px'; canvas.style.height = cssH + 'px';
    document.getElementById('wrap').style.width = cssW + 'px';
    document.getElementById('wrap').style.height = cssH + 'px';
    KK.Render3D.resize(cssW, cssH, dpr);
  }

  var state = KK.Game.create();
  try { KK.Render3D.init(canvas, document.getElementById('hud')); }
  catch (err) { document.getElementById('fallback').hidden = false; return; }
  if (perfLv >= 3 && KK.Render3D.lowPower) KK.Render3D.lowPower();
  window.addEventListener('resize', resize);
  resize();

  KK.UI.init({
    root: document.getElementById('ui'),
    canvas: canvas,
    getState: function () { return state; },
    onFlap: function () { KK.Game.flap(state); },
    onRestart: function () { KK.Game.reset(state, KK.UI.startOpts ? KK.UI.startOpts() : null); }   // v2.2: son checkpoint'ten
  });
  if (KK.UI.startOpts) KK.Game.reset(state, KK.UI.startOpts());   // açılışta da kayıtlı checkpoint'ten başla

  var verEl = document.getElementById('ver');
  verEl.textContent = 'v' + KK.APP_VERSION;
  var last = performance.now(), hitStop = 0;
  function frame(now) {
    var rawMs = now - last;
    var dt = Math.min(rawMs / 1000, 1 / 30);
    last = now;
    var paused = KK.UI.isPaused && KK.UI.isPaused();   // v2.0: durdurulmuşken oyun donar
    // v2.1: çarpma anında 80 ms "hit-stop" — darbe hissedilsin diye oyun bir an donar
    if (hitStop > 0) { hitStop -= dt; paused = true; }
    if (!paused) {
      KK.Game.update(state, dt);
      if (state.events.indexOf('bump') >= 0 || state.events.indexOf('hit') >= 0) hitStop = 0.08;
      else if (state.events.indexOf('shield') >= 0) hitStop = 0.05;   // v2.5: kalkan patlayınca daha kısa bir duraklama
    }
    if (!perfDone && state.mode === 'playing' && !paused && rawMs < 250) {
      perfN++; perfMs += rawMs;
      if (perfN >= 180) {
        if (1000 * perfN / perfMs < 50) {
          perfLv++; dprCap = LV_DPR[perfLv]; resize();
          if (perfLv >= 3 && KK.Render3D.lowPower) KK.Render3D.lowPower();
          try { localStorage.setItem(PERF_KEY, String(perfLv)); } catch (e) { /* yoksay */ }
          perfDone = perfLv >= 3;
        } else perfDone = true;            // yeterince akıcı → ölçüm biter
        perfN = 0; perfMs = 0;
      }
    }
    state.best = KK.UI.getBest();
    if (KK.UI.skinFor) KK.Render3D.setSkin(KK.UI.skinFor(state.mode));
    KK.Render3D.draw(state, paused ? 0 : dt, dt);
    KK.UI.handleEvents(state.events, state);
    KK.UI.update(state);
    state.events.length = 0;
    var vh = state.mode !== 'ready'; if (verEl.hidden !== vh) verEl.hidden = vh;   // v3.0: DOM'a sadece değişince yaz
    // Yeni sürüm indirildiyse: oyun ortasında değil, ana ekrandayken sessizce yenile
    if (KK.updateReady && state.mode === 'ready') { KK.updateReady = false; location.reload(); return; }
    requestAnimationFrame(frame);
  }
  // ---- Test modu: linkin sonuna #bot eklenince otomatik pilot + fps sayacı ----
  var BOT = location.hash === '#bot';
  var fpsEl = null, fpsN = 0, fpsT = performance.now();
  if (BOT) {
    fpsEl = document.createElement('div');
    fpsEl.style.cssText = 'position:fixed;left:8px;bottom:8px;z-index:9;padding:4px 8px;border-radius:6px;background:rgba(27,24,56,.8);color:#ffcf6b;font:600 13px/1.2 monospace;pointer-events:none';
    document.body.appendChild(fpsEl);
  }
  function bot(now) {
    fpsN++;
    if (now - fpsT >= 1000) {
      fpsEl.textContent = fpsN + ' fps · ' + renderer() + ' · score ' + state.score;
      fpsN = 0; fpsT = now;
    }
    var p = state.plane;
    if (state.mode === 'dead') { if (state.modeTime > 1.2) KK.Game.reset(state); return; }
    var g = state.gates.find(function (g) { return g.x + g.w > p.x - 15; });
    var target = g ? g.gapY + 16 : 320;
    if (state.mode === 'ready' || (p.y > target && p.vy > -40)) KK.Game.flap(state);
  }
  var glName = null;
  function renderer() {
    if (glName) return glName;
    try {
      var gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
      var ext = gl && gl.getExtension('WEBGL_debug_renderer_info');
      glName = ext ? String(gl.getParameter(ext.UNMASKED_RENDERER_WEBGL)).replace(/^ANGLE \(|\)$/g, '').slice(0, 48) : 'WebGL';
    } catch (e) { glName = 'WebGL'; }
    return glName;
  }
  if (BOT) {
    var inner = frame;
    frame = function (now) { bot(now); inner(now); };
  }
  requestAnimationFrame(frame);
  KK.__state = function () { return state; };
})();
</script>
<script>
  // Çevrimdışı çalışma + "Uygulamayı yükle" için service worker
  if ('serviceWorker' in navigator) {
    // İlk kurulumda zaten yeni sürüm açık; sonraki bir güncelleme devreye girince ana ekranda yenile
    var hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (hadController) window.KK.updateReady = true;
      hadController = true;
    });
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').then(function (reg) {
        // v1.5: uygulama arka plandan öne gelince de güncelleme sor (tam kapatmaya gerek kalmasın)
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') reg.update().catch(function () {});
        });
        setInterval(function () { reg.update().catch(function () {}); }, 30 * 60 * 1000);
      }).catch(function () {});
    });
  }
</script>
</body>
</html>
